name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.CACHE_ENCRYPTION_KEY }}

      - name: Build
        run: sh gradlew make generateUpdaterJson

      - name: Publish
        run: |
          mkdir builds
          mv */build/outputs/*.zip build/outputs/updater.json builds
          cd builds

          git init -q
          git fetch -q "https://x:${{ github.token }}@github.com/$GITHUB_REPOSITORY" builds || false && git reset FETCH_HEAD

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "chore: publish"
          git push "https://x:${{ github.token }}@github.com/$GITHUB_REPOSITORY" HEAD:builds
