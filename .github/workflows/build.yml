name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-encryption-key: ${{ secrets.CACHE_ENCRYPTION_KEY }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew make generateUpdaterJson

      - name: Publish
        run: |
          mkdir builds
          mv */build/outputs/*.zip build/outputs/updater.json builds
          cd builds

          git init
          git fetch "https://x:${{ github.token }}@github.com/${{ github.repository }}" builds || false && git reset FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: publish"
          git push "https://x:${{ github.token }}@github.com/${{ github.repository }}" HEAD:builds
