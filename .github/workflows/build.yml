name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Java
        uses: actions/setup-java@main
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          cache-encryption-key: ${{ secrets.CACHE_ENCRYPTION_KEY }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew make generateUpdaterJson

      - name: Publish
        run: |
          mkdir builds
          mv */build/outputs/*.zip build/outputs/updater.json builds
          cd builds

          git init
          git fetch "https://x:${{ github.token }}@github.com/${{ github.repository }}" builds || false && git reset FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: publish"
          git push "https://x:${{ github.token }}@github.com/${{ github.repository }}" HEAD:builds
