name: Build
on: push

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew make generateUpdaterJson

      - name: Publish
        run: |
          mkdir builds
          mv */build/outputs/*.zip build/outputs/updater.json builds
          cd builds

          git init
          git fetch "https://x:${{ github.token }}@github.com/${{ github.repository }}" builds || false && git reset FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: publish"
          git push "https://x:${{ github.token }}@github.com/${{ github.repository }}" HEAD:builds